<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kindle 设备控制</title>
<style>body{font:16px system-ui;max-width:460px;margin:48px auto;padding:0 24px;color:#171717}h1{font-size:24px}label{display:block;margin:28px 0 8px}input{width:100%}button{padding:10px 14px;margin:12px 10px 0 0}small,p{color:#555;line-height:1.6}a{color:inherit}</style>
<h1>Kindle 设备控制</h1><p id="status" role="status">读取设备状态…</p>
<label for="brightness">亮度 <output id="b">—</output> / 24</label><input id="brightness" type="range" min="0" max="24" disabled>
<label for="warmth">暖光 <output id="w">—</output> / 24</label><input id="warmth" type="range" min="0" max="24" disabled>
<p><button data-action="native_settings">打开原生设置</button><button data-action="dashboard">返回看板</button><button data-action="status">刷新状态</button></p>
<p><small>打开原生设置后，可在 Kindle 顶部向下滑动调整。调好后点击“返回看板”。灯光调整也可以直接使用上面的滑块。</small></p><p><a href="/">返回预览</a></p>
<script>
const status=document.getElementById('status');let busy=false;
async function command(action,value=0){try{let r=await fetch('/api/device',{method:'POST',headers:{'X-Kindle-Desk':'control','Content-Type':'application/json'},body:JSON.stringify({action,value})});if(r.status===409){status.textContent='等待上一条操作完成';return}if(!r.ok)throw Error('请求失败');busy=true;status.textContent='等待 Kindle 确认…';await update()}catch(e){status.textContent=e.message}}
async function update(){try{let x=await(await fetch('/api/device')).json();busy=!!x.pending&&!x.expired;status.textContent=busy?'等待 Kindle 确认…':x.expired?'设备未确认，请重新连接或刷新状态':x.ok===false?'设备执行失败，可重试或返回看板':x.mode==='native_settings'?'原生设置已打开':x.mode==='dashboard'?'看板模式':'尚未收到设备状态';for(let [id,key,out] of [['brightness','brightness','b'],['warmth','warmth','w']]){let e=document.getElementById(id),v=x[key];e.disabled=busy||v===null||v===undefined;if(v!==null&&v!==undefined){document.getElementById(out).value=v;if(document.activeElement!==e)e.value=v}}document.querySelectorAll('button').forEach(e=>e.disabled=busy)}catch(e){status.textContent='本机服务未连接'}}
for(let id of ['brightness','warmth']){let e=document.getElementById(id);e.addEventListener('input',()=>document.getElementById(id==='brightness'?'b':'w').value=e.value);e.addEventListener('change',()=>command(id,Number(e.value)))}document.querySelectorAll('button').forEach(e=>e.onclick=()=>command(e.dataset.action));command('status');setInterval(update,1000);
</script></html>
