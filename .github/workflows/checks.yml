name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock pytest
      - run: python -m pytest -q
      - run: node --check panel/panel.js
      - run: for script in kindle/*.sh scripts/*.sh; do sh -n "$script"; done
