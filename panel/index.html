<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindle Desk</title><link rel="stylesheet" href="panel.css"></head>
<body><main id="panel" aria-label="Kindle Desk 看板">
<header class="masthead">
  <section class="clock-block"><time id="clock">--:--</time><div id="date" class="date"></div></section>
  <section class="weather"><div class="city" id="city">伦敦</div><div class="conditions"><img id="weather-icon" src="assets/cloud.svg" alt=""><strong id="temperature">—</strong><span id="weather-description"></span></div><div id="forecast" class="forecast"></div></section>
  <section class="computer"><img src="assets/device-laptop.svg" alt=""><div><strong id="computer-name">Mac</strong><span id="computer-detail">macOS</span></div></section>
</header>
<div class="content">
  <section class="feed" aria-label="Codex 问答"><header class="feed-heading"><h1>Codex</h1><div id="counts"></div></header><div id="conversations" class="conversations"></div><nav class="navigation" aria-label="问答翻页"><button data-action="prev" id="previous"><img src="assets/chevron-left.svg" alt="">上一页</button><button data-action="overview" id="page-label">1 / 1</button><button data-action="next" id="next">下一页<img src="assets/chevron-right.svg" alt=""></button></nav></section>
  <aside class="sidebar"><h2 id="system-heading">系统状态</h2>
    <section class="resource cpu"><div class="resource-label"><h3>CPU</h3><strong id="cpu-value">—</strong></div><canvas id="cpu-chart" width="254" height="105" aria-label="CPU 使用率最近趋势"></canvas><div class="secondary" id="cpu-caption">最近 8 分钟</div></section>
    <section class="resource"><div class="resource-label"><h3 id="memory-heading">内存</h3><strong id="memory-value">—</strong></div><div class="resource-detail" id="memory-detail">—</div><progress id="memory-bar" max="100" value="0" aria-label="内存使用率"></progress></section>
    <section class="resource"><div class="resource-label"><h3 id="disk-heading">磁盘</h3><strong id="disk-value">—</strong></div><div class="resource-detail" id="disk-detail">—</div><progress id="disk-bar" max="100" value="0" aria-label="磁盘使用率"></progress></section>
    <section class="kindle-battery"><div class="resource-label"><h3 id="battery-heading">Kindle 电量</h3></div><div class="battery-reading"><strong id="battery-value">—</strong><img id="battery-icon" src="assets/battery.svg" alt=""></div><div id="battery-detail" class="secondary">等待读取</div></section>
    <footer class="sidebar-footer"><span id="updated"></span><button id="language" data-action="language" aria-label="Switch to English">EN</button></footer>
  </aside>
</div></main><div id="measure" aria-hidden="true"></div><script src="panel.js"></script></body></html>
