description "Kindle Desk appliance mode"
start on framework_ready
stop on stopping lab126
normal exit 0
# A failed takeover must not enter a restart loop.
pre-start script
    test -f /var/local/kindle-desk/enabled || test -f /tmp/kindle-desk-manual || { stop; exit 0; }
end script
exec /bin/sh /var/local/kindle-desk/bootstrap.sh
